name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup JDK 17 ───────────────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 3. Setup Python 3.10 ──────────────────────────────────────────────
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 4. System dependencies ────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip wget \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      # ── 5. Install buildozer & Cython ─────────────────────────────────────
      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.37

      # ── 6. Cache ~/.buildozer ─────────────────────────────────────────────
      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v5
          restore-keys: |
            buildozer-${{ runner.os }}-v5

      # ── 7. Cache pip ──────────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # ── 8. Setup Android SDK with sdkmanager ──────────────────────────────
      # Buildozer 1.5 expects sdkmanager at tools/bin/sdkmanager (old path).
      # Google no longer ships that; we install cmdline-tools and symlink.
      - name: Setup Android SDK + sdkmanager
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          # Remove any stale symlink or empty dir left over from cache
          if [ -L "$SDK_DIR" ]; then
            echo "Removing stale symlink $SDK_DIR"
            rm -f "$SDK_DIR"
          fi

          mkdir -p "$SDK_DIR"

          # Only download if sdkmanager not already present (cache hit)
          if [ ! -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Downloading Android Command Line Tools..."
            wget -q \
              "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" \
              -O /tmp/cmdtools.zip
            mkdir -p /tmp/cmdtools_extract
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extract
            mkdir -p "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdtools_extract/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
            rm -rf /tmp/cmdtools.zip /tmp/cmdtools_extract
          else
            echo "sdkmanager already present (cache hit)"
          fi

          # Create compatibility symlink at the path buildozer 1.5 expects
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" \
                 "$SDK_DIR/tools/bin/sdkmanager"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/avdmanager" \
                 "$SDK_DIR/tools/bin/avdmanager"

          echo "sdkmanager version:"
          "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --version

      # ── 9. Accept licenses + install required SDK components ──────────────
      - name: Accept SDK licenses and install components
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          # Write license files (avoids interactive prompt)
          mkdir -p "$SDK_DIR/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" \
            > "$SDK_DIR/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" \
            > "$SDK_DIR/licenses/android-sdk-preview-license"

          # Install required components (skip if already cached)
          "$SDKMANAGER" --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            2>&1 | grep -v "^Warning:" || true

          echo "=== SDK components installed ==="
          ls "$SDK_DIR"

      # ── 10. Build APK ─────────────────────────────────────────────────────
      - name: Build APK (debug)
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      # ── 11. List output ───────────────────────────────────────────────────
      - name: List build output
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin/ tidak ada"
          echo "=== APK search ==="
          find . -name "*.apk" 2>/dev/null || echo "Tidak ada APK"

      # ── 12. Upload APK ────────────────────────────────────────────────────
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navigasi-indonesia-apk
          path: bin/*.apk
          retention-days: 30

      # ── 13. Upload build log ──────────────────────────────────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
