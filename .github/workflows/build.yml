name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup JDK 17 (wajib untuk sdkmanager terbaru) ─────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 3. Setup Python 3.10 ──────────────────────────────────────────────
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 4. System dependencies ────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      # ── 5. Accept Android SDK licenses (tulis hash langsung) ──────────────
      - name: Accept Android SDK licenses
        run: |
          ANDROID_SDK=$ANDROID_SDK_ROOT
          mkdir -p "$ANDROID_SDK/licenses"
          # android-sdk-license
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" \
            > "$ANDROID_SDK/licenses/android-sdk-license"
          # android-sdk-preview-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" \
            > "$ANDROID_SDK/licenses/android-sdk-preview-license"
          # android-googletv-license
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" \
            > "$ANDROID_SDK/licenses/android-googletv-license"
          # intel-android-extra-license
          printf "d975f751698a77b662f1254ddbeed3901e976f5a\n" \
            > "$ANDROID_SDK/licenses/intel-android-extra-license"
          echo "Licenses written to $ANDROID_SDK/licenses"
          ls "$ANDROID_SDK/licenses"

      # ── 6. Install SDK components yang dibutuhkan buildozer ───────────────
      - name: Install Android SDK components
        run: |
          sdkmanager --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "ndk;25.2.9519653"

      # ── 7. Cache buildozer ────────────────────────────────────────────────
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ── 8. Cache pip ──────────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # ── 9. Install buildozer ──────────────────────────────────────────────
      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.37

      # ── 10. Konfigurasi buildozer pakai SDK yang sudah ada ────────────────
      - name: Configure buildozer SDK paths
        run: |
          mkdir -p ~/.buildozer/android/platform
          # Symlink SDK & NDK ke lokasi yang buildozer cari
          ln -sfn $ANDROID_SDK_ROOT \
            ~/.buildozer/android/platform/android-sdk
          ln -sfn $ANDROID_SDK_ROOT/ndk/25.2.9519653 \
            ~/.buildozer/android/platform/android-ndk-r25b
          # Copy licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp -f $ANDROID_SDK_ROOT/licenses/* \
            ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true
          echo "SDK path: $(readlink -f ~/.buildozer/android/platform/android-sdk)"
          echo "NDK path: $(readlink -f ~/.buildozer/android/platform/android-ndk-r25b)"

      # ── 11. Build APK ─────────────────────────────────────────────────────
      - name: Build APK (debug)
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}

      # ── 12. List output ───────────────────────────────────────────────────
      - name: List build output
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin/ tidak ada"
          echo "=== APK search ==="
          find . -name "*.apk" 2>/dev/null || echo "Tidak ada APK ditemukan"

      # ── 13. Upload APK ────────────────────────────────────────────────────
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navigasi-indonesia-apk
          path: bin/*.apk
          retention-days: 30

      # ── 14. Upload build log (selalu) ─────────────────────────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
