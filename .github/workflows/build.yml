name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup JDK 17 ───────────────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 3. Setup Python 3.10 ──────────────────────────────────────────────
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 4. System dependencies ────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip wget \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      # ── 5. Install buildozer & Cython ─────────────────────────────────────
      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.37

      # ── 6. Cache ~/.buildozer ─────────────────────────────────────────────
      #   Key bumped to v4 to bust the old symlink-based cache
      - name: Cache buildozer global dir
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v4
          restore-keys: |
            buildozer-${{ runner.os }}-v4

      # ── 7. Cache pip ──────────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # ── 8. Fix double-nested SDK (sdk/sdk/) from stale cache ─────────────
      - name: Fix SDK structure if double-nested
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          # If the SDK dir is a symlink, remove it — we want a real directory
          if [ -L "$SDK_DIR" ]; then
            echo "Removing stale symlink at $SDK_DIR"
            rm -f "$SDK_DIR"
          fi

          # If tools/bin/sdkmanager is missing but sdk/tools/bin/sdkmanager exists,
          # the SDK is double-nested. Flatten it.
          if [ -d "$SDK_DIR/sdk" ] && [ ! -d "$SDK_DIR/tools" ]; then
            echo "Detected double-nested SDK — flattening $SDK_DIR/sdk/ → $SDK_DIR/"
            # Move everything from sdk/ up one level
            mv "$SDK_DIR/sdk/"* "$SDK_DIR/" 2>/dev/null || true
            rmdir "$SDK_DIR/sdk" 2>/dev/null || true
            echo "SDK structure after fix:"
            ls "$SDK_DIR"
          else
            echo "SDK structure looks fine (or SDK not yet downloaded)."
          fi

      # ── 9. Pre-accept Android SDK licenses ────────────────────────────────
      - name: Pre-accept Android SDK licenses
        run: |
          mkdir -p "$HOME/.buildozer/android/platform/android-sdk/licenses"
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n8933bad161af4178b1185d1a37fbf41ea5269c55\n" \
            > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" \
            > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license"
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" \
            > "$HOME/.buildozer/android/platform/android-sdk/licenses/android-googletv-license"
          printf "d975f751698a77b662f1254ddbeed3901e976f5a\n" \
            > "$HOME/.buildozer/android/platform/android-sdk/licenses/intel-android-extra-license"
          echo "Licenses written."

      # ── 10. Build APK ─────────────────────────────────────────────────────
      - name: Build APK (debug)
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      # ── 11. List output ───────────────────────────────────────────────────
      - name: List build output
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin/ tidak ada"
          echo "=== APK search ==="
          find . -name "*.apk" 2>/dev/null || echo "Tidak ada APK"

      # ── 12. Upload APK ────────────────────────────────────────────────────
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navigasi-indonesia-apk
          path: bin/*.apk
          retention-days: 30

      # ── 13. Upload build log (selalu) ─────────────────────────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
