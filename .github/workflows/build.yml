name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4

      # 1. Install dependencies sistem
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip wget \
            openjdk-17-jdk python3-pip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache

      # 2. Setup Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Setup Python 3.10
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 4. Install buildozer & cython
      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.37

      # 5. Cache ~/.buildozer
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}-v6
          restore-keys: |
            buildozer-${{ runner.os }}-v6

      # 6. Download Android Command Line Tools & buat symlink untuk buildozer 1.5
      - name: Install Android SDK tools
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"

          # Hapus symlink lama jika ada
          [ -L "$SDK_DIR" ] && rm -f "$SDK_DIR"
          mkdir -p "$SDK_DIR/cmdline-tools"

          # Download hanya jika belum ada (cache hit)
          if [ ! -f "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "Downloading cmdline-tools..."
            curl -L "https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip" \
              -o /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools_extract
            mkdir -p "$SDK_DIR/cmdline-tools/latest"
            mv /tmp/cmdtools_extract/cmdline-tools/* "$SDK_DIR/cmdline-tools/latest/"
            rm -rf /tmp/cmdtools.zip /tmp/cmdtools_extract
          else
            echo "sdkmanager sudah ada (cache hit)"
          fi

          # Symlink ke path lama yang dicari buildozer 1.5
          mkdir -p "$SDK_DIR/tools/bin"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" "$SDK_DIR/tools/bin/sdkmanager"
          ln -sf "$SDK_DIR/cmdline-tools/latest/bin/avdmanager"  "$SDK_DIR/tools/bin/avdmanager"

          echo "sdkmanager OK: $("$SDK_DIR/cmdline-tools/latest/bin/sdkmanager" --version)"

      # 7. Accept licenses & install SDK components sesuai buildozer.spec
      - name: Accept SDK licenses and install components
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          SDKMANAGER="$SDK_DIR/cmdline-tools/latest/bin/sdkmanager"

          # Accept semua lisensi otomatis
          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses 2>/dev/null || true

          # Install komponen sesuai buildozer.spec (android.api=33, build_tools=33.0.2)
          "$SDKMANAGER" --sdk_root="$SDK_DIR" \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            2>&1 | grep -v "^Warning:" || true

      # 8. Build APK
      - name: Build APK (debug)
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      # 9. Cek output
      - name: List build output
        if: always()
        run: |
          ls -la bin/ 2>/dev/null || echo "bin/ tidak ada"
          find . -name "*.apk" 2>/dev/null || echo "Tidak ada APK"

      # 10. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navigasi-indonesia-apk
          path: bin/*.apk
          retention-days: 30

      # 11. Upload build log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7