name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup Python ───────────────────────────────────────────────────
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 3. System dependencies ────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache \
            libltdl-dev

      # ── 4. Setup Android SDK dengan license sudah di-accept ───────────────
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 5. Install Android build tools & platform (license auto-accepted) ─
      - name: Install Android SDK components
        run: |
          sdkmanager --install "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          sdkmanager --licenses <<< "y" || true

      # ── 6. Cache buildozer ────────────────────────────────────────────────
      - name: Cache buildozer global directory
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ── 7. Cache pip ──────────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # ── 8. Install buildozer ──────────────────────────────────────────────
      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.37

      # ── 9. Accept semua Android SDK licenses ─────────────────────────────
      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses || true
          mkdir -p $ANDROID_SDK_ROOT/licenses
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c2829b004d1fee" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
          echo "84831b9409646a918e30573bab4c9c91346d8abd" > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license

      # ── 10. Konfigurasi buildozer pakai SDK yang sudah ada ────────────────
      - name: Configure buildozer to use existing SDK
        run: |
          mkdir -p ~/.buildozer/android/platform
          # Symlink SDK yang sudah di-setup ke lokasi yang buildozer cari
          ln -sfn $ANDROID_SDK_ROOT ~/.buildozer/android/platform/android-sdk
          # Copy licenses ke lokasi buildozer
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp -f $ANDROID_SDK_ROOT/licenses/* ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true

      # ── 11. Build APK ─────────────────────────────────────────────────────
      - name: Build APK (debug)
        run: |
          buildozer -v android debug 2>&1 | tee build.log
        env:
          ANDROID_SDK_ROOT: ${{ env.ANDROID_SDK_ROOT }}
          ANDROID_HOME: ${{ env.ANDROID_SDK_ROOT }}

      # ── 12. List build output ─────────────────────────────────────────────
      - name: List build output
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin/ tidak ada"
          echo "=== APK search ==="
          find . -name "*.apk" 2>/dev/null || echo "Tidak ada APK"

      # ── 13. Upload APK ────────────────────────────────────────────────────
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navigasi-indonesia-apk
          path: bin/*.apk
          retention-days: 30

      # ── 14. Upload build log (selalu) ─────────────────────────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
