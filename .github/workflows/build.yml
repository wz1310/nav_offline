name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Setup JDK 17 ───────────────────────────────────────────────────
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      # ── 3. Setup Python 3.10 ──────────────────────────────────────────────
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ── 4. System dependencies ────────────────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            git zip unzip \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake libffi-dev libssl-dev \
            build-essential ccache libltdl-dev

      # ── 5. Cari sdkmanager & accept licenses ──────────────────────────────
      - name: Setup Android SDK licenses and components
        run: |
          # Cari sdkmanager di semua kemungkinan lokasi
          SDKMANAGER=""
          for p in \
            "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_SDK_ROOT/cmdline-tools/9.0/bin/sdkmanager" \
            "/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager" \
            "$(find /usr/local/lib/android -name sdkmanager 2>/dev/null | head -1)"; do
            if [ -f "$p" ]; then
              SDKMANAGER="$p"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager tidak ditemukan, download manual..."
            mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip \
              -O /tmp/cmdtools.zip
            unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
            mkdir -p $ANDROID_SDK_ROOT/cmdline-tools/latest
            mv /tmp/cmdtools/cmdline-tools/* $ANDROID_SDK_ROOT/cmdline-tools/latest/
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi

          echo "Menggunakan sdkmanager: $SDKMANAGER"
          echo "SDKMANAGER=$SDKMANAGER" >> $GITHUB_ENV

          # Tulis license files langsung (tidak perlu interactive prompt)
          mkdir -p $ANDROID_SDK_ROOT/licenses
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n" \
            > $ANDROID_SDK_ROOT/licenses/android-sdk-license
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" \
            > $ANDROID_SDK_ROOT/licenses/android-sdk-preview-license
          printf "601085b94cd77f0b54ff86406957099ebe79c4d6\n" \
            > $ANDROID_SDK_ROOT/licenses/android-googletv-license
          printf "d975f751698a77b662f1254ddbeed3901e976f5a\n" \
            > $ANDROID_SDK_ROOT/licenses/intel-android-extra-license
          echo "Licenses OK"

          # Install komponen yang dibutuhkan
          "$SDKMANAGER" --sdk_root=$ANDROID_SDK_ROOT \
            "platform-tools" \
            "build-tools;33.0.2" \
            "platforms;android-33" \
            "ndk;25.2.9519653"

      # ── 6. Cache buildozer ────────────────────────────────────────────────
      - name: Cache buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-${{ runner.os }}-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            buildozer-${{ runner.os }}-

      # ── 7. Cache pip ──────────────────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-

      # ── 8. Install buildozer ──────────────────────────────────────────────
      - name: Install buildozer and Cython
        run: |
          pip install --upgrade pip wheel
          pip install buildozer==1.5.0 cython==0.29.37

      # ── 9. Konfigurasi buildozer pakai SDK yang sudah ada ─────────────────
      - name: Configure buildozer SDK paths
        run: |
          mkdir -p ~/.buildozer/android/platform

          # Symlink SDK
          ln -sfn $ANDROID_SDK_ROOT \
            ~/.buildozer/android/platform/android-sdk

          # Symlink NDK
          NDK_PATH="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          if [ -d "$NDK_PATH" ]; then
            ln -sfn "$NDK_PATH" \
              ~/.buildozer/android/platform/android-ndk-r25b
            echo "NDK linked: $NDK_PATH"
          else
            echo "WARNING: NDK tidak ditemukan di $NDK_PATH"
            find $ANDROID_SDK_ROOT/ndk -maxdepth 1 2>/dev/null || echo "ndk folder kosong"
          fi

          # Copy licenses
          mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
          cp -f $ANDROID_SDK_ROOT/licenses/* \
            ~/.buildozer/android/platform/android-sdk/licenses/ 2>/dev/null || true

          echo "=== Buildozer platform dir ==="
          ls -la ~/.buildozer/android/platform/

      # ── 10. Build APK ─────────────────────────────────────────────────────
      - name: Build APK (debug)
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      # ── 11. List output ───────────────────────────────────────────────────
      - name: List build output
        if: always()
        run: |
          echo "=== bin/ ==="
          ls -la bin/ 2>/dev/null || echo "bin/ tidak ada"
          echo "=== APK search ==="
          find . -name "*.apk" 2>/dev/null || echo "Tidak ada APK"

      # ── 12. Upload APK ────────────────────────────────────────────────────
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: navigasi-indonesia-apk
          path: bin/*.apk
          retention-days: 30

      # ── 13. Upload build log (selalu) ─────────────────────────────────────
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
