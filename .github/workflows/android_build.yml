name: Build Android APK (React Native)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-package-lock

      - name: Prebuild Android project
        run: npx expo prebuild --platform android --no-install

      # Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # Build APK using Gradle
      - name: Build Android APK
        run: |
          cd android && ./gradlew assembleDebug
        continue-on-error: true # Expo needs special setup for local builds

      # Alternative for Expo: Use EAS Build (Recommended for Expo)
      # Since we don't have EAS configured, we provide the manual steps
      
      - name: List Output
        run: ls -R android/app/build/outputs/apk/ || echo "No APK found yet"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/*.apk
